name: Windows probe (temporary)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    name: Windows capability probe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Capability probe
        shell: bash
        run: |
          python tools/_windows_probe2.py > probe.txt 2>&1 || true
          python tools/_windows_probe2.py > probe.txt 2>&1 || true
          cat probe.txt

      - name: Failing test detail
        shell: bash
        run: |
          : > pytest.txt
          python -m pytest -q --tb=short -rf -p no:cacheprovider --co -q > pytest.txt 2>&1 || true
          echo "skipped full run" >> pytest.txt
          : <<'COMMENT'
          python -m pytest -q --tb=short -rf -p no:cacheprovider \
            tests/integration/test_cli_entry_point.py \
            tests/integration/test_stage2_scan.py \
            tests/security/test_discovery_safety.py \
            tests/security/test_stage2_safety.py \
            tests/security/test_subprocess_and_redaction.py \
            tests/unit/test_cli.py \
            tests/unit/test_discovery_failures.py \
            tests/unit/test_tooling.py >> pytest.txt 2>&1 || true
          tail -n 20 pytest.txt
          COMMENT

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe
          path: |
            probe.txt
            pytest.txt

      - name: Publish results as PR comments
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import traceback

          pr = os.environ["PR_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          for filename in ("probe.txt", "pytest.txt"):
              try:
                  with open(filename, encoding="utf-8", errors="replace") as handle:
                      text = handle.read()
              except OSError as exc:
                  print(f"missing {filename}: {exc}")
                  continue
              chunk = 38000
              pieces = [text[i : i + chunk] for i in range(0, len(text), chunk)] or [""]
              print(f"{filename}: {len(text)} chars in {len(pieces)} part(s)")
              for index, piece in enumerate(pieces, start=1):
                  body = f"PROBE-RESULT {filename} part {index}/{len(pieces)}\n\n```\n{piece}\n```"
                  with open("comment_body.txt", "w", encoding="utf-8") as handle:
                      handle.write(body)
                  try:
                      subprocess.run(
                          [
                              "gh",
                              "api",
                              "-X",
                              "POST",
                              f"repos/{repo}/issues/{pr}/comments",
                              "-F",
                              "body=@comment_body.txt",
                          ],
                          check=True,
                      )
                  except Exception:  # noqa: BLE001
                      traceback.print_exc()
          PY

  ubuntu-repro:
    name: Ubuntu repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        shell: bash
        run: |
          python -m pytest --cov=repolens --cov-report=term-missing -q > pytest.txt 2>&1 || true
          tail -n 40 pytest.txt
      - name: Publish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          text = open("pytest.txt", encoding="utf-8", errors="replace").read()[-30000:]
          body = "PROBE-RESULT ubuntu-pytest\n\n```\n" + text + "\n```"
          open("comment_body.txt", "w", encoding="utf-8").write(body)
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
                          "-F", "body=@comment_body.txt"], check=False)
          PY
