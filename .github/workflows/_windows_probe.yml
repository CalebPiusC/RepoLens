name: Windows probe (temporary)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    name: Windows capability probe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Capability probe
        shell: bash
        run: |
          python tools/_windows_probe.py > probe.txt 2>&1 || true
          cat probe.txt

      - name: Failing test detail
        shell: bash
        run: |
          python -m pytest -q --tb=long -rf \
            tests/integration/test_cli_entry_point.py \
            tests/integration/test_stage2_scan.py \
            tests/security/test_discovery_safety.py \
            tests/security/test_stage2_safety.py \
            tests/security/test_subprocess_and_redaction.py \
            tests/unit/test_cli.py \
            tests/unit/test_discovery_failures.py \
            tests/unit/test_tooling.py > pytest.txt 2>&1 || true
          cat pytest.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe
          path: |
            probe.txt
            pytest.txt

      - name: Publish results as PR comments
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          pr = os.environ["PR_NUMBER"]
          for filename in ("probe.txt", "pytest.txt"):
              try:
                  text = open(filename, encoding="utf-8", errors="replace").read()
              except OSError:
                  continue
              chunk = 55000
              pieces = [text[i : i + chunk] for i in range(0, len(text), chunk)] or [""]
              for index, piece in enumerate(pieces, start=1):
                  body = f"PROBE-RESULT {filename} part {index}/{len(pieces)}\n\n```\n{piece}\n```"
                  subprocess.run(
                      ["gh", "api", "-X", "POST", f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{pr}/comments",
                       "-f", f"body={body}"],
                      check=True,
                  )
          PY
