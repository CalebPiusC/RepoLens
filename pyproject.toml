[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "repolens"
dynamic = ["version"]
description = "An open-source repository health checker for Python and JavaScript/TypeScript projects."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "pius caleb" },
]
keywords = [
    "code-quality",
    "developer-tools",
    "javascript",
    "python",
    "repository-health",
    "security",
    "static-analysis",
    "typescript",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "packaging>=24.0,<27.0",
    "pydantic>=2.7,<3.0",
]

[project.urls]
Homepage = "https://github.com/CalebPiusC/RepoLens"
Repository = "https://github.com/CalebPiusC/RepoLens"
Documentation = "https://github.com/CalebPiusC/RepoLens#readme"
Issues = "https://github.com/CalebPiusC/RepoLens/issues"
Changelog = "https://github.com/CalebPiusC/RepoLens/blob/main/docs/changelog/README.md"

[project.scripts]
repolens = "repolens.cli:main"

[project.optional-dependencies]
# Optional external static-analysis tools. RepoLens never installs these automatically.
tools = [
    "bandit>=1.7,<2.0",
    "ruff>=0.6,<1.0",
]
dev = [
    "bandit>=1.7,<2.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

# One static source of truth; no Git tags, SCM plugins, or network needed to read it.
[tool.hatch.version]
path = "src/repolens/_version.py"

[tool.hatch.build]
reproducible = true
# Even within the package tree, do not ship tests or common local/secret Python files.
exclude = [
    "**/tests/",
    "**/test_*.py",
    "**/conftest.py",
    "**/local_*.py",
    "**/*_local.py",
    "**/credentials.py",
    "**/credentials_*.py",
    "**/*_credentials.py",
    "**/secrets.py",
    "**/.*/",
    "**/.*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/repolens/**/*.py",
    "/src/repolens/py.typed",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
include = ["/src/repolens/**/*.py", "/src/repolens/py.typed"]
sources = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "RUF",
    "S",
    "PT",
    "C4",
    "PIE",
    "RET",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
"src/repolens/subprocess_runner.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that exercise the optional OSV.dev client against a mocked transport",
]

[tool.coverage.run]
source = ["repolens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
